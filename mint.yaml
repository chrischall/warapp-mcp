version: 1
name: war.app (Warzone)
slug: warapp
# Hosting: browser bridge. GameFeed is called directly with the API token, but
# the live board, territory picks, turn orders and chat sends go over war.app's web-client
# protocol (/Services), and turn notifications over its socket.io push channel
# (xhr-polling) — both authenticated by the browser's cookies, so the
# fetchproxy bridge relays them through the user's signed-in war.app tab. The
# registration therefore also needs `bridge: true` and
# `bridgePortEnv: WARAPP_WS_PORT` (with a runtime that supports a bridge) —
# registration fields this manifest has no schema for.
#
# Direct transport. A local install can link the signed-in war.app session
# (warapp_link_session, stored on that machine) and then talk to war.app
# directly without a browser (WARAPP_TRANSPORT=auto/direct). A hosted child
# never stores a session and never registers warapp_link_session (src/hosted.ts):
# it rides the direct leg only from the session captured at sign-in — the
# AuthToken mcp-host's authFlow (`auth.flow` below) captures into the per-user
# secret WARAPP_AUTH_TOKEN (#333: the war.app password is asked once and never
# stored; the token is held in memory) — with the bridge above as its fallback
# on the same registration. Without that token it is pinned to the bridge, as
# before. THE TRADE-OFF: once the registration carries the flow, every NEW
# connection needs one successful war.app password sign-in. mcp-host ends the
# login with no grant on any warapp_sign_in refusal — a captcha, an outage or
# a network fault as well as a wrong password — and may clear the fields
# already entered; an account with no war.app password (Facebook sign-in)
# cannot connect. The bridge is the fallback only for connections made before
# the flow was added and for a session that expires later. Adding the flow is
# the owner's decision (docs/PLAN-DIRECT.md, "Registration change", step 2). The flow is docs/examples/warapp-auth-flow.json (shipped in the npm
# package): one masked password prompt, then warapp_sign_in with WARAPP_EMAIL
# and that password as the capture, path authToken into WARAPP_AUTH_TOKEN.
# WARAPP_AUTH_TOKEN is deliberately not in `env`: a capture into a host-set
# variable is refused.
summary: >-
  war.app (Warzone) advisor: games waiting on you, maps, scouting, chat and
  turn plans. Joining, leaving or surrendering games,
  accepting surrenders, Begin, picks, turn orders, withdrawals, chat sends,
  chat read and notification marks, deletes and history imports happen only
  after you confirm.
examples:
  - prompt: Which of my war.app games are waiting on me?
    note: Lists your games through your war.app tab, the ones waiting on you first.
  - prompt: Scout the other players in my war.app game 12345678 — how good are they, and how have I done against them?
    note: Level, games played, boot rate and ranked records, plus the games you have played together.
  - prompt: Which bonuses on the map of my war.app game 12345678 are easiest to take and hold?
    note: Ranks bonuses by value per territory and per border.
  - prompt: Plan my turn in war.app game 12345678 to complete a bonus, then submit it.
    note: Plans deploys and moves from the live board; submits only after you confirm.
  - prompt: Tell me when it's my turn in war.app games 12345678 and 23456789.
    note: Waits on war.app's push notifications through your war.app tab.

identity:
  # One child per caller: GameFeed answers AS the player whose email + token
  # are presented, so two people sharing one child would share one player's
  # view of every game (fog included). Required for `auth` below.
  perUserChild: true

auth:
  # Collected once on the connector's authorize page: GameFeed takes the email
  # + token on every request (form body), with no login exchange. Every auth
  # field is stored as a per-user secret (the field schema has no separate
  # `secret` flag). The `flow` then signs in to war.app once for the direct
  # transport (see the header): a path inside the package, read at the pin.
  fields:
    - name: WARAPP_EMAIL
      label: war.app email
      type: text
      required: true
      help: The email address you sign in to war.app with.
    - name: WARAPP_API_TOKEN
      label: war.app API token
      type: password
      required: true
      help: >-
        Your API token, shown at https://war.app/API/GetAPIToken while signed
        in to war.app. Stored as a per-user secret and never shown again.
        Changing your war.app password rotates it — reconnect with the new one.
  flow: docs/examples/warapp-auth-flow.json

# WARAPP_EMAIL / WARAPP_API_TOKEN are collected per user above, and an auth
# field may not name a host-set variable, so they are not in `env`. Set them in
# the environment (or ~/.config/warapp-mcp/.env, or the file WARAPP_ENV_FILE
# names) only for a local, single-user install.
env:
  - name: WARAPP_WS_PORT
    required: false
    help: >-
      Concentrator port for the fetchproxy bridge (defaults to the fleet-shared
      37149). The runner injects a per-registration port for a hosted bridged
      child, so this is the name to give `bridgePortEnv` at registration.
  - name: WARAPP_DEBUG
    required: false
    help: >-
      Truthy logs the fetchproxy bridge's role and lifecycle to stderr.
      Diagnostic only.
  - name: WARAPP_TRANSPORT
    required: false
    help: >-
      How the live-game tools reach war.app on a LOCAL install: auto (default —
      the chrome-less direct transport when a session is linked, else the
      browser bridge), direct, or fetchproxy. A hosted child keeps the bridge
      unless mcp-host captured a war.app session at sign-in (WARAPP_AUTH_TOKEN);
      then it reads this as a local install does.
  - name: WARAPP_PLAYER_RECORD
    required: false
    help: >-
      The cross-game record of how other players kept truces (name-free, keyed
      by a salted hash; owner decision D5, on by default, hosted as well). Set
      off to switch it off.
  - name: WARAPP_PLAYER_PROFILE
    required: false
    help: >-
      Opponent profiles: gameplay counts per game and across games (name-free,
      keyed by the same salted hash; owner decision P4, on by default, hosted
      as well). Set off to switch it off.
  - name: WARAPP_DECISION_LOG
    required: false
    help: >-
      The per-game decision log (each turn's view, plan, orders sent and, once
      the game ends, the true figures; ids and numbers, no names). On by
      default, hosted as well. Set off to switch it off, or full to keep every
      turn uncompacted.
  - name: WARAPP_SESSION_FILE
    required: false
    help: >-
      Local-only: where the linked direct-transport session is stored (default
      <dataDir>/session.json, file mode 0600). A hosted child stores no session.

state:
  dataDir: true
  reason: >-
    Two things must survive a cold start. The fetchproxy identity
    ($HOME/.fetchproxy/identity/warapp-mcp.json) is what the browser extension
    paired with: without a persistent $HOME every cold start mints a new
    identity and asks the user to pair again. And the war.app client bundle
    (ujs.js, ~16 MB) is cached under $MCP_DATA_DIR/bundle/<version>.<sha256>.js: the
    live board is decoded with the client's own readers, so without the cache
    every cold start downloads it again. The agreement ledger
    ($MCP_DATA_DIR/relations: the truces recorded per game) lives there too, and
    so does the cross-game player record (relations/players.json and its salt:
    owner decision D5, on hosted as well, name-free and keyed by a salted hash;
    WARAPP_PLAYER_RECORD=off switches it off), and the opponent profile turns
    ($MCP_DATA_DIR/profiles/games: gameplay counts per game, owner decision P4,
    on hosted as well, folded when a game finishes into the name-free
    profiles/players.json and population.json, keyed by the same salt; WARAPP_PLAYER_PROFILE=off switches it off), and the
    end-of-game records ($MCP_DATA_DIR/finished: once per finished game the
    account played, its history read once and kept name-free under the same
    salt, its boards and final outlook line included, at most 500, and a lasting hashed mark per game in
    finished/processed.json (5000 keys) so a game is never read twice; a read whose record cannot be
    written is remembered in-process and not repeated; each captured history is
    then folded into the profiles, the per-map record at
    $MCP_DATA_DIR/maps-record/<mapId>.json and the lessons at
    $MCP_DATA_DIR/lessons.json, both name-free and bounded, read back only to be
    reported beside the picks, plans and tracks, never planned on). GameFeed maps are kept at
    $MCP_DATA_DIR/maps/<mapId>.json (public map data, base bonus values, at most
    40, re-downloaded after 30 days) with maps/games.json naming each game's map,
    so a known game is not downloaded with its map again after a cold start; and
    each planned game's settings are kept name-free at
    $MCP_DATA_DIR/games/<gameId>.json (players by id only), so the cached boards
    can be replayed offline. A local install's history can be imported into
    this dir (warapp_import_state, confirm-gated: the salt and the stores
    keyed by it, a different salt moved aside into
    $MCP_DATA_DIR/state-backups/<time>/, never deleted).

egress:
  allow:
    # Fetched by this process: POST /API/GameFeed (src/client.ts). The
    # /Services calls and war.app pages go through the user's tab over the
    # bridge, not from here.
    - war.app
    # The client bundle (https://warappcdn.com/js/Release/ujs.js?v=<n>),
    # downloaded directly once per version (src/tools/live-context.ts).
    - warappcdn.com
    # Not listed: mcp-host's own blob store (MCP_BLOB_BASE_URL, the gateway
    # serving this connector; its host differs per deployment).
    # warapp_upload_slots signs a PUT URL for a state bundle (a local
    # install's history, `warapp-mcp export-state`), and warapp_import_state
    # GETs it back and DELETEs it once imported. Signed requests only; no
    # war.app credential is ever sent there.
