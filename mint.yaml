version: 1
name: war.app (Warzone)
slug: warapp
# Hosting: browser bridge. GameFeed is called directly with the API token, but
# the live board, territory picks, turn orders and chat sends go over war.app's web-client
# protocol (/Services), and turn notifications over its socket.io push channel
# (xhr-polling) — both authenticated by the browser's cookies, so the
# fetchproxy bridge relays them through the user's signed-in war.app tab. The
# registration therefore also needs `bridge: true` and
# `bridgePortEnv: WARAPP_WS_PORT` (with a runtime that supports a bridge) —
# registration fields this manifest has no schema for.
#
# Direct transport is LOCAL-ONLY. A local install can link the signed-in
# war.app session (warapp_link_session) and then talk to war.app directly
# without a browser (WARAPP_TRANSPORT=auto/direct). That stores a full-account
# AuthToken on the machine, so hosting never uses it: a hosted child keeps the
# browser bridge above and stores no session token — enforced in code
# (src/hosted.ts): when hosted, warapp_link_session is not registered, the
# session store reads as empty and the transport is pinned to the bridge.
# Nothing in this manifest enables direct mode.
summary: >-
  war.app (Warzone) game advisor — your games, players and settings, map
  bonuses and chokepoints, board analysis and route planning through war.app's
  GameFeed API, plus the games waiting on you, opponent scouting (their record and
  your head-to-head), the live board, territory picks, turn planning and game chat
  through your signed-in war.app tab, with card plays and a wait for your turn on
  war.app's push notifications. Joining or surrendering a game, Begin on a speed
  first turn, picks, turn orders, withdrawing them and chat messages are sent only
  after you confirm.
examples:
  - prompt: Which of my war.app games are waiting on me?
    note: Lists your games through your war.app tab, the ones waiting on you first.
  - prompt: Scout the other players in my war.app game 12345678 — how good are they, and how have I done against them?
    note: Level, games played, boot rate and ranked records, plus the games you have played together.
  - prompt: Which bonuses on the map of my war.app game 12345678 are easiest to take and hold?
    note: Ranks bonuses by value per territory and per border.
  - prompt: Plan my turn in war.app game 12345678 to complete a bonus, then submit it.
    note: Plans deploys and moves from the live board; submits only after you confirm.
  - prompt: Tell me when it's my turn in war.app games 12345678 and 23456789.
    note: Waits on war.app's push notifications through your war.app tab.

identity:
  # One child per caller: GameFeed answers AS the player whose email + token
  # are presented, so two people sharing one child would share one player's
  # view of every game (fog included). Required for `auth` below.
  perUserChild: true

auth:
  # Collected once on the connector's authorize page. There is no `flow`:
  # GameFeed takes the email + token on every request (form body), with no
  # login exchange, MFA or session to mint. Every auth field is stored as a
  # per-user secret (the field schema has no separate `secret` flag).
  fields:
    - name: WARAPP_EMAIL
      label: war.app email
      type: text
      required: true
      help: The email address you sign in to war.app with.
    - name: WARAPP_API_TOKEN
      label: war.app API token
      type: password
      required: true
      help: >-
        Your API token, shown at https://war.app/API/GetAPIToken while signed
        in to war.app. Stored as a per-user secret and never shown again.
        Changing your war.app password rotates it — reconnect with the new one.

# WARAPP_EMAIL / WARAPP_API_TOKEN are collected per user above, and an auth
# field may not name a host-set variable, so they are not in `env`. Set them in
# the environment (or ~/.config/warapp-mcp/.env, or the file WARAPP_ENV_FILE
# names) only for a local, single-user install.
env:
  - name: WARAPP_WS_PORT
    required: false
    help: >-
      Concentrator port for the fetchproxy bridge (defaults to the fleet-shared
      37149). The runner injects a per-registration port for a hosted bridged
      child, so this is the name to give `bridgePortEnv` at registration.
  - name: WARAPP_DEBUG
    required: false
    help: >-
      Truthy logs the fetchproxy bridge's role and lifecycle to stderr.
      Diagnostic only.
  - name: WARAPP_TRANSPORT
    required: false
    help: >-
      How the live-game tools reach war.app on a LOCAL install: auto (default —
      the chrome-less direct transport when a session is linked, else the
      browser bridge), direct, or fetchproxy. A hosted child keeps the bridge.
  - name: WARAPP_SESSION_FILE
    required: false
    help: >-
      Local-only: where the linked direct-transport session is stored (default
      <dataDir>/session.json, file mode 0600). A hosted child stores no session.

state:
  dataDir: true
  reason: >-
    Two things must survive a cold start. The fetchproxy identity
    ($HOME/.fetchproxy/identity/warapp-mcp.json) is what the browser extension
    paired with: without a persistent $HOME every cold start mints a new
    identity and asks the user to pair again. And the war.app client bundle
    (ujs.js, ~16 MB) is cached under $MCP_DATA_DIR/bundle/<version>.<sha256>.js: the
    live board is decoded with the client's own readers, so without the cache
    every cold start downloads it again. The per-map GameFeed cache lives in
    memory and needs no state.

egress:
  allow:
    # Fetched by this process: POST /API/GameFeed (src/client.ts). The
    # /Services calls and war.app pages go through the user's tab over the
    # bridge, not from here.
    - war.app
    # The client bundle (https://warappcdn.com/js/Release/ujs.js?v=<n>),
    # downloaded directly once per version (src/tools/live-context.ts).
    - warappcdn.com
